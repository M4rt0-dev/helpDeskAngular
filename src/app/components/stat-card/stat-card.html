<div class="bg-card border border-border rounded-lg p-6">
  <div class="flex items-center justify-between mb-4">
    <span class="text-sm text-muted-foreground">{{ title() }}</span>
    <div>
      <lucide-icon [name]="icon()" class="w-5 h-4 text-black p-1"></lucide-icon>
    </div>
  </div>

  <div class="flex items-end justify-between">
    <div class="text-3xl text-foreground">{{ value() }}</div>

    @if (change()) {
      <span
        class="text-sm px-2 py-0.5 rounded h-6 mt-2"
        [class.bg-green-100]="change()!.startsWith('+')"
        [class.text-green-700]="change()!.startsWith('+')"
        [class.bg-primary-soft]="!change()!.startsWith('+')"
        [class.text-primary]="!change()!.startsWith('+')"
      >
        {{ change() }}
      </span>
    }
  </div>
</div>
