<div class="min-h-screen flex items-center justify-center bg-muted/30">
  <div class="bg-card p-8 rounded-lg shadow-lg w-full max-w-md border border-border">
    <h2 class="text-2xl mb-6 text-center">Iniciar Sesión</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm mb-1">Usuario</label>
        <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" class="w-full border rounded-lg px-4 py-2" />
      </div>
      <div>
        <label class="block text-sm mb-1">Contraseña</label>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" class="w-full border rounded-lg px-4 py-2" />
      </div>
      <button (click)="submit()" class="w-full bg-primary text-white rounded-lg py-2 mt-4 hover:bg-primary/90">
        Entrar
      </button>
      <div class="text-center mt-4 text-sm">
        <span class="text-muted-foreground">¿No tienes cuenta? </span>
        <button (click)="onOpenRegister()" class="text-primary hover:underline">Regístrate</button>
      </div>
    </div>
  </div>
</div>
